openapi: 3.2.0
info:
  version: ''
  x-affinity-api-version: '2024-01-01'
  contact:
    email: support@affinity.co
    name: Affinity Support
    url: https://support.affinity.co
  description: '# Introduction


    Welcome to Affinity API v2!'
  license:
    name: Proprietary
    url: https://www.affinity.co/legal/terms-of-use
  termsOfService: https://www.affinity.co/legal/terms-of-use
  title: Affinity API v2 Lists API
  x-logo:
    url: https://s3.us-west-2.amazonaws.com/assets.affinity.co/img/logos/full-color-svg.svg
    altText: Affinity logo
servers:
- url: https://api.affinity.co
security:
- bearerAuth: []
tags:
- description: Operations about lists
  name: Lists
paths:
  /v2/lists:
    get:
      description: 'Paginate through all Lists in your organization that you have access to view.

        Returns basic information about each List, including name, owner, and privacy settings.'
      summary: Get metadata on all Lists
      operationId: v2_lists__GET
      tags:
      - Lists
      parameters:
      - name: cursor
        description: Cursor for the next or previous page
        in: query
        schema:
          type: string
          examples:
          - ICAgICAgYmVmb3JlOjo6Nw
        example: ICAgICAgYmVmb3JlOjo6Nw
      - name: limit
        description: Number of items to include in the page
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 100
          examples:
          - 100
        example: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWithTypePaged'
              examples:
                success:
                  $ref: '#/components/examples/success'
          headers:
            X-Ratelimit-Limit-User:
              $ref: '#/components/headers/X-Ratelimit-Limit-User'
            X-Ratelimit-Limit-User-Remaining:
              $ref: '#/components/headers/X-Ratelimit-Limit-User-Remaining'
            X-Ratelimit-Limit-User-Reset:
              $ref: '#/components/headers/X-Ratelimit-Limit-User-Reset'
            X-Ratelimit-Limit-Org:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org'
            X-Ratelimit-Limit-Org-Remaining:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org-Remaining'
            X-Ratelimit-Limit-Org-Reset:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org-Reset'
        '400':
          $ref: '#/components/responses/400'
        default:
          $ref: '#/components/responses/default'
  /v2/lists/{listId}:
    get:
      description: 'Retrieve detailed information about a specific List you have access to view.

        Returns List configuration including name, owner, privacy settings, and creation details.'
      summary: Get metadata on a single List
      operationId: v2_lists_listId__GET
      tags:
      - Lists
      parameters:
      - name: listId
        description: List ID
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854776000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWithType'
              examples:
                company-list:
                  $ref: '#/components/examples/company-list'
                opportunity-list:
                  $ref: '#/components/examples/opportunity-list'
                person-list:
                  $ref: '#/components/examples/person-list'
          headers:
            X-Ratelimit-Limit-User:
              $ref: '#/components/headers/X-Ratelimit-Limit-User'
            X-Ratelimit-Limit-User-Remaining:
              $ref: '#/components/headers/X-Ratelimit-Limit-User-Remaining'
            X-Ratelimit-Limit-User-Reset:
              $ref: '#/components/headers/X-Ratelimit-Limit-User-Reset'
            X-Ratelimit-Limit-Org:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org'
            X-Ratelimit-Limit-Org-Remaining:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org-Remaining'
            X-Ratelimit-Limit-Org-Reset:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org-Reset'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        default:
          $ref: '#/components/responses/default'
  /v2/lists/{listId}/list-entries:
    get:
      description: 'Paginate through the List Entries (AKA rows) on a given List.

        Returns basic information and field data, including list-specific

        field data, on each Company, Person, or Opportunity on the List.

        List Entries also include metadata about their creation,

        i.e., when they were added to the List and by whom.


        To retrieve field data, you must use either the `fieldIds` or the `fieldTypes` parameter

        to specify the Fields for which you want data returned.

        These Field IDs and Types can be found using the GET `/v2/lists/{listId}/fields` endpoint.

        When no `fieldIds` or `fieldTypes` are provided, List Entries will be returned without any field data attached.

        To supply multiple `fieldIds` or `fieldTypes` parameters, generate a query string that looks like this:

        `?fieldIds=field-1234&fieldIds=affinity-data-location` or `?fieldTypes=enriched&fieldTypes=global`.


        Requires the "Export data from Lists" permission.'
      summary: Get all List Entries on a List
      operationId: v2_lists_listId_list-entries__GET
      tags:
      - Lists
      parameters:
      - name: listId
        description: List ID
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854776000
      - name: cursor
        description: Cursor for the next or previous page
        in: query
        schema:
          type: string
          examples:
          - ICAgICAgYmVmb3JlOjo6Nw
        example: ICAgICAgYmVmb3JlOjo6Nw
      - name: limit
        description: Number of items to include in the page
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 100
          examples:
          - 100
        example: 100
      - name: fieldIds
        description: Field IDs for which to return field data
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
          examples:
          - - field-1
        example:
        - field-1
        - field-2
      - name: fieldTypes
        description: Field Types for which to return field data
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - enriched
            - global
            - list
            - relationship-intelligence
        example:
        - enriched
        - global
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEntryWithEntityPaged'
              examples:
                company-list-enriched:
                  $ref: '#/components/examples/company-list-enriched'
                company-list-relationship-intelligence:
                  $ref: '#/components/examples/company-list-relationship-intelligence'
                company-list-global-and-list:
                  $ref: '#/components/examples/company-list-global-and-list'
          headers:
            X-Ratelimit-Limit-User:
              $ref: '#/components/headers/X-Ratelimit-Limit-User'
            X-Ratelimit-Limit-User-Remaining:
              $ref: '#/components/headers/X-Ratelimit-Limit-User-Remaining'
            X-Ratelimit-Limit-User-Reset:
              $ref: '#/components/headers/X-Ratelimit-Limit-User-Reset'
            X-Ratelimit-Limit-Org:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org'
            X-Ratelimit-Limit-Org-Remaining:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org-Remaining'
            X-Ratelimit-Limit-Org-Reset:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org-Reset'
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        default:
          $ref: '#/components/responses/default'
  /v2/lists/{listId}/list-entries/{listEntryId}:
    get:
      description: 'Retrieve a single list entry.

        Returns basic information and field data, including list-specific field data.


        To retrieve field data, you must use either the `fieldIds` or the `fieldTypes` parameter

        to specify the Fields for which you want data returned.

        These Field IDs and Types can be found using the GET `/v2/lists/{listId}/fields` endpoint.

        When no `fieldIds` or `fieldTypes` are provided, the List Entry will be returned without any field data attached.

        To supply multiple `fieldIds` or `fieldTypes` parameters, generate a query string that looks like this:

        `?fieldIds=field-1234&fieldIds=affinity-data-location` or `?fieldTypes=enriched&fieldTypes=global`.


        Requires the "Export data from Lists" permission.'
      summary: Get a single List Entry on a List
      operationId: v2_lists_listId_list-entries_listEntryId__GET
      tags:
      - Lists
      parameters:
      - name: listId
        description: List ID
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854776000
      - name: listEntryId
        description: List Entry ID
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854776000
      - name: fieldIds
        description: Field IDs for which to return field data
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
          examples:
          - - field-1
        example:
        - field-1
        - field-2
      - name: fieldTypes
        description: Field Types for which to return field data
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - enriched
            - global
            - list
            - relationship-intelligence
        example:
        - enriched
        - global
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEntryWithEntity'
              examples:
                company-list-enriched:
                  $ref: '#/components/examples/company-list-enriched-2'
                company-list-relationship-intelligence:
                  $ref: '#/components/examples/company-list-relationship-intelligence-2'
                company-list-global-and-list:
                  $ref: '#/components/examples/company-list-global-and-list-2'
          headers:
            X-Ratelimit-Limit-User:
              $ref: '#/components/headers/X-Ratelimit-Limit-User'
            X-Ratelimit-Limit-User-Remaining:
              $ref: '#/components/headers/X-Ratelimit-Limit-User-Remaining'
            X-Ratelimit-Limit-User-Reset:
              $ref: '#/components/headers/X-Ratelimit-Limit-User-Reset'
            X-Ratelimit-Limit-Org:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org'
            X-Ratelimit-Limit-Org-Remaining:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org-Remaining'
            X-Ratelimit-Limit-Org-Reset:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org-Reset'
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        default:
          $ref: '#/components/responses/default'
  /v2/lists/{listId}/list-entries/{listEntryId}/fields:
    get:
      description: 'Paginate through all field values on a single list entry.


        All fields will be included by default. The `ids` and `types` parameters can be used to filter the collection.


        Requires the "Export data from Lists" permission.'
      summary: Get field values on a single List Entry
      operationId: v2_lists_listId_list-entries_listEntryId_fields__GET
      tags:
      - Lists
      parameters:
      - name: listId
        description: List ID
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854776000
      - name: listEntryId
        description: List Entry ID
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854776000
      - name: ids
        description: Field IDs for which to return field data
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
          examples:
          - - field-1
        example:
        - field-1
        - field-2
      - name: types
        description: Field Types for which to return field data
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - enriched
            - global
            - list
            - relationship-intelligence
        example:
        - enriched
        - global
      - name: cursor
        description: Cursor for the next or previous page
        in: query
        schema:
          type: string
          examples:
          - ICAgICAgYmVmb3JlOjo6Nw
        example: ICAgICAgYmVmb3JlOjo6Nw
      - name: limit
        description: Number of items to include in the page
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
          examples:
          - 20
        example: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldPaged'
              examples:
                company-list-enriched:
                  $ref: '#/components/examples/company-list-enriched-3'
                company-list-relationship-intelligence:
                  $ref: '#/components/examples/company-list-relationship-intelligence-3'
                company-list-global-and-list:
                  $ref: '#/components/examples/company-list-global-and-list-3'
          headers:
            X-Ratelimit-Limit-User:
              $ref: '#/components/headers/X-Ratelimit-Limit-User'
            X-Ratelimit-Limit-User-Remaining:
              $ref: '#/components/headers/X-Ratelimit-Limit-User-Remaining'
            X-Ratelimit-Limit-User-Reset:
              $ref: '#/components/headers/X-Ratelimit-Limit-User-Reset'
            X-Ratelimit-Limit-Org:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org'
            X-Ratelimit-Limit-Org-Remaining:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org-Remaining'
            X-Ratelimit-Limit-Org-Reset:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org-Reset'
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        default:
          $ref: '#/components/responses/default'
    patch:
      description: 'Perform batch operations on a list entry''s fields.


        Currently the only operation at the endpoint is `update-fields`, which allows you to update multiple field values with a single request. This is equivalent to calling the single field update endpoint multiple times.


        Requires the "Export data from Lists" permission.'
      summary: Perform batch operations on a list entry's fields
      operationId: v2_lists_listId_list-entries_listEntryId_fields__PATCH
      tags:
      - Lists
      parameters:
      - name: listId
        description: List ID
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854776000
      - name: listEntryId
        description: List Entry ID
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854776000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListEntryBatchOperationRequest'
            examples:
              update-fields:
                $ref: '#/components/examples/update-fields'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEntryBatchOperationResponse'
              examples:
                update-fields:
                  $ref: '#/components/examples/update-fields-2'
          headers:
            X-Ratelimit-Limit-User:
              $ref: '#/components/headers/X-Ratelimit-Limit-User'
            X-Ratelimit-Limit-User-Remaining:
              $ref: '#/components/headers/X-Ratelimit-Limit-User-Remaining'
            X-Ratelimit-Limit-User-Reset:
              $ref: '#/components/headers/X-Ratelimit-Limit-User-Reset'
            X-Ratelimit-Limit-Org:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org'
            X-Ratelimit-Limit-Org-Remaining:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org-Remaining'
            X-Ratelimit-Limit-Org-Reset:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org-Reset'
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        default:
          $ref: '#/components/responses/default'
  /v2/lists/{listId}/list-entries/{listEntryId}/fields/{fieldId}:
    get:
      description: 'Returns a single field value on a list entry.


        Requires the "Export data from Lists" permission.'
      summary: Get a single field value
      operationId: v2_lists_listId_list-entries_listEntryId_fields_fieldId__GET
      tags:
      - Lists
      parameters:
      - name: listId
        description: List ID
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854776000
      - name: listEntryId
        description: List Entry ID
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854776000
      - name: fieldId
        description: Field ID
        in: path
        required: true
        schema:
          type: string
          examples:
          - affinity-data-location
          - field-1234
        example: field-1234
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Field'
              examples:
                company:
                  $ref: '#/components/examples/company'
                company-multi:
                  $ref: '#/components/examples/company-multi'
                datetime:
                  $ref: '#/components/examples/datetime'
                dropdown:
                  $ref: '#/components/examples/dropdown'
                dropdown-multi:
                  $ref: '#/components/examples/dropdown-multi'
                filterable-text:
                  $ref: '#/components/examples/filterable-text'
                filterable-text-multi:
                  $ref: '#/components/examples/filterable-text-multi'
                formula-number:
                  $ref: '#/components/examples/formula-number'
                interaction:
                  $ref: '#/components/examples/interaction'
                location:
                  $ref: '#/components/examples/location'
                location-multi:
                  $ref: '#/components/examples/location-multi'
                number:
                  $ref: '#/components/examples/number'
                number-multi:
                  $ref: '#/components/examples/number-multi'
                person:
                  $ref: '#/components/examples/person'
                person-multi:
                  $ref: '#/components/examples/person-multi'
                ranked-dropdown:
                  $ref: '#/components/examples/ranked-dropdown'
                text:
                  $ref: '#/components/examples/text'
          headers:
            X-Ratelimit-Limit-User:
              $ref: '#/components/headers/X-Ratelimit-Limit-User'
            X-Ratelimit-Limit-User-Remaining:
              $ref: '#/components/headers/X-Ratelimit-Limit-User-Remaining'
            X-Ratelimit-Limit-User-Reset:
              $ref: '#/components/headers/X-Ratelimit-Limit-User-Reset'
            X-Ratelimit-Limit-Org:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org'
            X-Ratelimit-Limit-Org-Remaining:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org-Remaining'
            X-Ratelimit-Limit-Org-Reset:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org-Reset'
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        default:
          $ref: '#/components/responses/default'
    post:
      description: 'Update a single field value.


        Requires the "Export data from Lists" permission.'
      summary: Update a single field value on a List Entry
      operationId: v2_lists_listId_list-entries_listEntryId_fields_fieldId__POST
      tags:
      - Lists
      parameters:
      - name: listId
        description: List ID
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854776000
      - name: listEntryId
        description: List Entry ID
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854776000
      - name: fieldId
        description: Field ID
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldUpdate'
            examples:
              company:
                $ref: '#/components/examples/company-2'
              company-multi:
                $ref: '#/components/examples/company-multi-2'
              datetime:
                $ref: '#/components/examples/datetime-2'
              dropdown:
                $ref: '#/components/examples/dropdown-2'
              dropdown-multi:
                $ref: '#/components/examples/dropdown-multi-2'
              filterable-text:
                $ref: '#/components/examples/filterable-text-2'
              filterable-text-multi:
                $ref: '#/components/examples/filterable-text-multi-2'
              location:
                $ref: '#/components/examples/location-2'
              location-multi:
                $ref: '#/components/examples/location-multi-2'
              number:
                $ref: '#/components/examples/number-2'
              number-multi:
                $ref: '#/components/examples/number-multi-2'
              person:
                $ref: '#/components/examples/person-2'
              person-multi:
                $ref: '#/components/examples/person-multi-2'
              ranked-dropdown:
                $ref: '#/components/examples/ranked-dropdown-2'
              text:
                $ref: '#/components/examples/text-2'
      responses:
        '204':
          description: No Content
          headers:
            X-Ratelimit-Limit-User:
              $ref: '#/components/headers/X-Ratelimit-Limit-User'
            X-Ratelimit-Limit-User-Remaining:
              $ref: '#/components/headers/X-Ratelimit-Limit-User-Remaining'
            X-Ratelimit-Limit-User-Reset:
              $ref: '#/components/headers/X-Ratelimit-Limit-User-Reset'
            X-Ratelimit-Limit-Org:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org'
            X-Ratelimit-Limit-Org-Remaining:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org-Remaining'
            X-Ratelimit-Limit-Org-Reset:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org-Reset'
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        default:
          $ref: '#/components/responses/default'
  /v2/lists/{listId}/fields:
    get:
      description: 'Returns metadata on the Fields available on a single List.


        Use the returned Field IDs to request field data from the GET `/v2/lists/{listId}/list-entries` endpoint.'
      summary: Get metadata on a single List's Fields
      operationId: v2_lists_listId_fields__GET
      tags:
      - Lists
      parameters:
      - name: listId
        description: List ID
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854776000
      - name: cursor
        description: Cursor for the next or previous page
        in: query
        schema:
          type: string
          examples:
          - ICAgICAgYmVmb3JlOjo6Nw
        example: ICAgICAgYmVmb3JlOjo6Nw
      - name: limit
        description: Number of items to include in the page
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 100
          examples:
          - 100
        example: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldMetadataPaged'
              examples:
                company-list:
                  $ref: '#/components/examples/company-list-2'
                person-list:
                  $ref: '#/components/examples/person-list-2'
                opportunity-list:
                  $ref: '#/components/examples/opportunity-list-2'
          headers:
            X-Ratelimit-Limit-User:
