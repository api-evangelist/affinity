components:
  schemas:
    Opportunity:
      title: Opportunity
      description: Opportunity model
      type: object
      properties:
        id:
          description: The unique identifier for the opportunity
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          examples:
          - 1
        name:
          description: The name of the opportunity
          type: string
          examples:
          - Acme Upsell $10k
        listId:
          description: The ID of the list that the opportunity belongs to
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          examples:
          - 1
      required:
      - id
      - listId
      - name
      additionalProperties: false
      examples:
      - listId: 1
        name: Acme Upsell $10k
        id: 1
    Pagination:
      title: Pagination
      type: object
      properties:
        prevUrl:
          description: URL for the previous page
          type:
          - string
          - 'null'
          format: uri
          examples:
          - https://api.affinity.co/v2/foo?cursor=ICAgICAgYmVmb3JlOjo6Nw
        nextUrl:
          description: URL for the next page
          type:
          - string
          - 'null'
          format: uri
          examples:
          - https://api.affinity.co/v2/foo?cursor=ICAgICAgIGFmdGVyOjo6NA
      examples:
      - prevUrl: https://api.affinity.co/v2/foo?cursor=ICAgICAgYmVmb3JlOjo6Nw
        nextUrl: https://api.affinity.co/v2/foo?cursor=ICAgICAgIGFmdGVyOjo6NA
    notes.Mention:
      x-stability-level: beta
      title: notes.Mention
      description: A mention in a note.
      oneOf:
      - $ref: '#/components/schemas/notes.PersonMention'
      discriminator:
        propertyName: type
        mapping:
          person: '#/components/schemas/notes.PersonMention'
    NotFoundError:
      title: NotFoundError
      type: object
      properties:
        code:
          description: Error code
          type: string
          enum:
          - not-found
        message:
          description: Error message
          type: string
      required:
      - code
      - message
      additionalProperties: false
      examples:
      - code: not-found
        message: 🚨 Error! Sound the alarm! 🚨
    ValidationError:
      title: ValidationError
      type: object
      properties:
        code:
          description: Error code
          type: string
          enum:
