        | `creator.id` | Filter notes by the creator of the note | `int32` | `=` | `creator.id=1` |

        | `createdAt` | Filter notes by when it was created | `datetime` | `>`, `=`, ``, `=`, `=2025-02-03T10:48:24Z`|'
      summary: Get replies for a Note
