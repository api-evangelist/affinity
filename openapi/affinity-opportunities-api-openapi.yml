          maximum: 9007199254740991
          examples:
          - 1
        name:
          description: The name of the opportunity
          type: string
          examples:
          - Acme Upsell $10k
        listId:
          description: The ID of the list that the opportunity belongs to
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          examples:
          - 1
      required:
      - id
      - listId
      - name
      additionalProperties: false
      examples:
      - listId: 1
        name: Acme Upsell $10k
        id: 1
