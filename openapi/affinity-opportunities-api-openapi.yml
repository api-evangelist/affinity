servers:
- url: https://api.affinity.co
security:
- bearerAuth: []
tags:
- description: Operations about opportunities
  name: Opportunities
paths:
  /v2/opportunities:
    get:
      description: 'Paginate through Opportunities in Affinity.

        Returns basic information but **not** field data on each Opportunity.


        To access field data on Opportunities, use the `/lists/{list_id}/list-entries`

        or the `/v2/lists/{list_id}/saved-views/{view_id}/list-entries` GET endpoint.


        Requires the "Export data from Lists" permission.'
      summary: Get all Opportunities
      operationId: v2_opportunities__GET
      tags:
      - Opportunities
      parameters:
      - name: cursor
        description: Cursor for the next or previous page
        in: query
        schema:
          type: string
          examples:
          - ICAgICAgYmVmb3JlOjo6Nw
        example: ICAgICAgYmVmb3JlOjo6Nw
      - name: limit
        description: Number of items to include in the page
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 100
          examples:
          - 100
        example: 100
      - name: ids
        description: Opportunity IDs
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
            maximum: 9223372036854776000
        example:
        - 1
        - 2
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityPaged'
          headers:
            X-Ratelimit-Limit-User:
              $ref: '#/components/headers/X-Ratelimit-Limit-User'
            X-Ratelimit-Limit-User-Remaining:
              $ref: '#/components/headers/X-Ratelimit-Limit-User-Remaining'
            X-Ratelimit-Limit-User-Reset:
              $ref: '#/components/headers/X-Ratelimit-Limit-User-Reset'
            X-Ratelimit-Limit-Org:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org'
            X-Ratelimit-Limit-Org-Remaining:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org-Remaining'
            X-Ratelimit-Limit-Org-Reset:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org-Reset'
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        default:
          $ref: '#/components/responses/default'
  /v2/opportunities/{opportunityId}:
    get:
      description: 'Returns basic information but **not** field data on the requested Opportunity.


        To access field data on Opportunities, use the `/lists/{list_id}/list-entries`

        or the `/v2/lists/{list_id}/saved-views/{view_id}/list-entries` GET endpoint.


        Requires the "Export data from Lists" permission.'
      summary: Get a single Opportunity
      operationId: v2_opportunities_opportunityId__GET
      tags:
      - Opportunities
      parameters:
      - name: opportunityId
        description: Opportunity ID
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854776000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Opportunity'
          headers:
            X-Ratelimit-Limit-User:
              $ref: '#/components/headers/X-Ratelimit-Limit-User'
            X-Ratelimit-Limit-User-Remaining:
              $ref: '#/components/headers/X-Ratelimit-Limit-User-Remaining'
            X-Ratelimit-Limit-User-Reset:
              $ref: '#/components/headers/X-Ratelimit-Limit-User-Reset'
            X-Ratelimit-Limit-Org:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org'
            X-Ratelimit-Limit-Org-Remaining:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org-Remaining'
            X-Ratelimit-Limit-Org-Reset:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org-Reset'
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        default:
          $ref: '#/components/responses/default'
  /v2/opportunities/{opportunityId}/notes:
    get:
      x-stability-level: beta
      description: '| ⚠️ This endpoint is currently in BETA |

        |--|


        Returns Notes for a given Opportunity which includes directly attached notes and those attached to persons on this Opportunity.


        You can filter notes using the `filter` query parameter. The filter parameter is a string that you can specify conditions based on the following properties.

        | **Property Name** | **Description** | **Type** | **Allowed Operators** | **Examples** |

        |-----------------------------|-----------------------------------------------------------------|------------|--------------------------------------|---------------------------------|

        | `creator.id` | Filter notes by the creator of the note | `int32` | `=` | `creator.id=1` |

        | `createdAt` | Filter notes by when it was created | `datetime` | `>`, `=`, ``, `=`, `=2025-02-03T10:48:24Z`|'
      summary: Get Notes for an Opportunity
      operationId: v2_opportunities_opportunityId_notes__GET
      tags:
      - Opportunities
      parameters:
      - name: opportunityId
        description: Opportunity ID
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854776000
      - name: filter
        description: Filter options
        in: query
        schema:
          type: string
      - name: cursor
        description: Cursor for the next or previous page
        in: query
        schema:
          type: string
      - name: limit
        description: Number of items to include in the page
        in: query
        schema:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          default: 20
      - name: totalCount
        description: Include total count of the collection in the pagination response
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notes.NotesPaged'
              examples:
                entities:
                  $ref: '#/components/examples/entities-3'
                interaction:
                  $ref: '#/components/examples/interaction-4'
                ai-notetaker:
                  $ref: '#/components/examples/ai-notetaker-3'
          headers:
            X-Ratelimit-Limit-User:
              $ref: '#/components/headers/X-Ratelimit-Limit-User'
            X-Ratelimit-Limit-User-Remaining:
              $ref: '#/components/headers/X-Ratelimit-Limit-User-Remaining'
            X-Ratelimit-Limit-User-Reset:
              $ref: '#/components/headers/X-Ratelimit-Limit-User-Reset'
            X-Ratelimit-Limit-Org:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org'
            X-Ratelimit-Limit-Org-Remaining:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org-Remaining'
            X-Ratelimit-Limit-Org-Reset:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org-Reset'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        default:
          $ref: '#/components/responses/default'
components:
