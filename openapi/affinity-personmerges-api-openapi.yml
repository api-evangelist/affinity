security:
- bearerAuth: []
tags:
- description: Operations about person merges
  name: personMerges
  x-stability-level: beta
paths:
  /v2/person-merges:
    get:
      x-stability-level: beta
      description: '| ⚠️ This endpoint is currently in BETA |

        |--|


        Retrieve paginated person merges for the organization.


        Returns all person merges initiated by users in your organization, including their current

        status, the persons involved, and merge details. You can filter person merges using the `filter` query parameter. The filter parameter is a string that you can specify conditions based on the following properties:


        | Property | Type | Operators | Values | Examples |

        |----------|------|-----------|--------|----------|

        | `status` | `enum` | `=` | `in-progress`, `success`, `failed` | `status=failed` |

        | `taskId` | `string` | `=` | | `taskId=789e0123-e45b-67c8-d901-234567890123` |


        Person merges are returned in reverse chronological order (most recent first).


        Requires the "Manage duplicates" permission and

        organization admin role.'
      summary: Get All Person Merges
      operationId: v2_person-merges__GET
      tags:
      - personMerges
      parameters:
      - name: cursor
        description: Cursor for the next or previous page
        in: query
        schema:
          type: string
        example: ICAgICAgYmVmb3JlOjo6Nw
      - name: limit
        description: Number of items to include in the page
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 25
        example: 25
      - name: filter
        description: Filter person merges using Affinity Filtering Language
        in: query
        schema:
          type: string
        example: status=failed | taskId=789e0123-e45b-67c8-d901-234567890123
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonMergeStatePaged'
              examples:
                merges-list:
                  $ref: '#/components/examples/merges-list-2'
          headers:
            X-Ratelimit-Limit-User:
              $ref: '#/components/headers/X-Ratelimit-Limit-User'
            X-Ratelimit-Limit-User-Remaining:
              $ref: '#/components/headers/X-Ratelimit-Limit-User-Remaining'
            X-Ratelimit-Limit-User-Reset:
              $ref: '#/components/headers/X-Ratelimit-Limit-User-Reset'
            X-Ratelimit-Limit-Org:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org'
            X-Ratelimit-Limit-Org-Remaining:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org-Remaining'
            X-Ratelimit-Limit-Org-Reset:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org-Reset'
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        default:
          $ref: '#/components/responses/default'
    post:
      x-stability-level: beta
      description: '| ⚠️ This endpoint is currently in BETA |

        |--|


        Initiate a person merge to combine a duplicate person profile into a primary person profile.


        This is an asynchronous process that will merge all data from the duplicate person into the primary person. Once the merge is initiated, you can track its progress using the returned task URL.


        Requires the "Manage duplicates" permission and organization admin role.'
      summary: Initiate Person Merge
      operationId: v2_person-merges__POST
      tags:
      - personMerges
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonMergeRequest'
            examples:
              merge-persons:
                $ref: '#/components/examples/merge-persons'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonMergeResponse'
              examples:
                merge-initiated:
                  $ref: '#/components/examples/merge-initiated-2'
          headers:
            X-Ratelimit-Limit-User:
              $ref: '#/components/headers/X-Ratelimit-Limit-User'
            X-Ratelimit-Limit-User-Remaining:
              $ref: '#/components/headers/X-Ratelimit-Limit-User-Remaining'
            X-Ratelimit-Limit-User-Reset:
              $ref: '#/components/headers/X-Ratelimit-Limit-User-Reset'
            X-Ratelimit-Limit-Org:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org'
            X-Ratelimit-Limit-Org-Remaining:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org-Remaining'
            X-Ratelimit-Limit-Org-Reset:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org-Reset'
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        default:
          $ref: '#/components/responses/default'
  /v2/person-merges/{mergeId}:
    get:
      x-stability-level: beta
      description: '| ⚠️ This endpoint is currently in BETA |

        |--|


        Retrieve the status and details of a specific person merge.


        Returns information about the person merge including its current status, the persons involved, timestamps, and any error information if the merge failed.


        The `mergeId` can be obtained from the response of the Get All Person Merges endpoint, or by filtering person merges by task ID using `/v2/person-merges?filter=taskId={taskId}` after initiating a merge.


        Requires the "Manage duplicates" permission and organization admin role.'
      summary: Get Person Merge
      operationId: v2_person-merges_mergeId__GET
      tags:
      - personMerges
      parameters:
      - name: mergeId
        description: Person merge ID
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          examples:
          - 12345
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonMergeState'
              examples:
                completed-merge:
                  $ref: '#/components/examples/succeeded-merge-2'
                failed-merge:
                  $ref: '#/components/examples/failed-merge-2'
                in-progress-merge:
                  $ref: '#/components/examples/in-progress-merge-2'
          headers:
            X-Ratelimit-Limit-User:
              $ref: '#/components/headers/X-Ratelimit-Limit-User'
            X-Ratelimit-Limit-User-Remaining:
              $ref: '#/components/headers/X-Ratelimit-Limit-User-Remaining'
            X-Ratelimit-Limit-User-Reset:
              $ref: '#/components/headers/X-Ratelimit-Limit-User-Reset'
            X-Ratelimit-Limit-Org:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org'
            X-Ratelimit-Limit-Org-Remaining:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org-Remaining'
            X-Ratelimit-Limit-Org-Reset:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org-Reset'
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        default:
          $ref: '#/components/responses/default'
  /v2/tasks/person-merges:
    get:
      x-stability-level: beta
      description: '| ⚠️ This endpoint is currently in BETA |

        |--|


        Retrieve paginated person merge tasks for the organization.


        Returns all merge tasks initiated by users in your organization, including their current status,

        the persons involved, and task details.


        You can filter tasks using the `filter` query parameter. The filter parameter is a string that you can specify conditions based on the following properties:


        | Property | Type | Operators | Values | Examples |

        |----------|------|-----------|--------|----------|

        | `status` | `enum` | `=` | `in-progress`, `success`, `failed` | `status=failed` |


        Tasks are returned in reverse chronological order (most recent first).


        Requires the "Manage duplicates" permission and

        organization admin role.'
      summary: Get All Person Merge Tasks
      operationId: v2_tasks_person-merges__GET
      tags:
      - personMerges
      parameters:
      - name: cursor
        description: Cursor for the next or previous page
        in: query
        schema:
          type: string
          examples:
          - ICAgICAgYmVmb3JlOjo6Nw
        example: ICAgICAgYmVmb3JlOjo6Nw
      - name: limit
        description: Number of items to include in the page
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 25
          examples:
          - 25
        example: 25
      - name: filter
        description: Filter tasks using Affinity Filtering Language
        in: query
        schema:
          type: string
        example: status=failed
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonMergeTaskPaged'
              examples:
                tasks-list:
                  $ref: '#/components/examples/tasks-list'
          headers:
            X-Ratelimit-Limit-User:
              $ref: '#/components/headers/X-Ratelimit-Limit-User'
            X-Ratelimit-Limit-User-Remaining:
              $ref: '#/components/headers/X-Ratelimit-Limit-User-Remaining'
            X-Ratelimit-Limit-User-Reset:
              $ref: '#/components/headers/X-Ratelimit-Limit-User-Reset'
            X-Ratelimit-Limit-Org:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org'
            X-Ratelimit-Limit-Org-Remaining:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org-Remaining'
            X-Ratelimit-Limit-Org-Reset:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org-Reset'
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        default:
          $ref: '#/components/responses/default'
  /v2/tasks/person-merges/{taskId}:
    get:
      x-stability-level: beta
      description: '| ⚠️ This endpoint is currently in BETA |

        |--|


        Retrieve the status and details of a specific task for person merges.


        Returns information about the person merges for a specific task including its overall status,

        number of merges in-progress, completed, and failed.


        Detailed information about individual merges for this task can be found by querying:

        `/v2/person-merges?filter=taskId={taskId}` See Person

        Merges for more details.


        Task statuses:


        - `in-progress`: The merge task is currently being processed.

        - `success`: The merge task completed successfully.

        - `failed`: The merge task failed.


        Requires the "Manage duplicates" permission and

        organization admin role.'
      summary: Get Person Merge Task
      operationId: v2_tasks_person-merges_taskId__GET
      tags:
      - personMerges
      parameters:
      - name: taskId
        description: Person merge task ID
        in: path
        required: true
        schema:
          type: string
          format: uuid
          examples:
          - 123e4567-e89b-12d3-a456-426614174000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonMergeTask'
              examples:
                task-in-progress:
                  $ref: '#/components/examples/task-in-progress'
                task-success:
                  $ref: '#/components/examples/task-success'
                task-failed:
                  $ref: '#/components/examples/task-failed'
          headers:
            X-Ratelimit-Limit-User:
              $ref: '#/components/headers/X-Ratelimit-Limit-User'
            X-Ratelimit-Limit-User-Remaining:
              $ref: '#/components/headers/X-Ratelimit-Limit-User-Remaining'
            X-Ratelimit-Limit-User-Reset:
              $ref: '#/components/headers/X-Ratelimit-Limit-User-Reset'
            X-Ratelimit-Limit-Org:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org'
            X-Ratelimit-Limit-Org-Remaining:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org-Remaining'
            X-Ratelimit-Limit-Org-Reset:
              $ref: '#/components/headers/X-Ratelimit-Limit-Org-Reset'
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        default:
          $ref: '#/components/responses/default'
components:
  headers:
    X-Ratelimit-Limit-Org:
      description: Number of requests allowed per month for the account
      schema:
        type: integer
    X-Ratelimit-Limit-Org-Remaining:
      description: Number of requests remaining for the account
      schema:
        type: integer
    X-Ratelimit-Limit-User-Remaining:
      description: Number of requests remaining for the user
      schema:
        type: integer
    X-Ratelimit-Limit-User:
      description: Number of requests allowed per minute for the user
      schema:
        type: integer
    X-Ratelimit-Limit-Org-Reset:
      description: Time in seconds before the limit resets for the account
      schema:
        type: integer
    X-Ratelimit-Limit-User-Reset:
      description: Time in seconds before the limit resets for the user
      schema:
        type: integer
  schemas:
    PersonMergeRequest:
      x-stability-level: beta
      title: PersonMergeRequest
      description: Request body for initiating a person merge
      type: object
      properties:
        primaryPersonId:
          description: The ID of the person profile that will be kept after the merge. All data from the duplicate person will be merged into this person.
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          examples:
          - 12345
        duplicatePersonId:
          description: The ID of the person profile that will be merged and then deleted. All data from this person will be transferred to the primary person.
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          examples:
          - 67890
      required:
      - primaryPersonId
      - duplicatePersonId
      additionalProperties: false
    Pagination:
      title: Pagination
      type: object
      properties:
        prevUrl:
          description: URL for the previous page
          type:
          - string
          - 'null'
          format: uri
          examples:
          - https://api.affinity.co/v2/foo?cursor=ICAgICAgYmVmb3JlOjo6Nw
        nextUrl:
          description: URL for the next page
          type:
          - string
          - 'null'
          format: uri
          examples:
          - https://api.affinity.co/v2/foo?cursor=ICAgICAgIGFmdGVyOjo6NA
      examples:
      - prevUrl: https://api.affinity.co/v2/foo?cursor=ICAgICAgYmVmb3JlOjo6Nw
        nextUrl: https://api.affinity.co/v2/foo?cursor=ICAgICAgIGFmdGVyOjo6NA
    PersonMergeTask:
      x-stability-level: beta
      title: PersonMergeTask
      description: Person merge task details and status for batch operations
      type: object
      properties:
        id:
          description: The unique identifier for this merge task
          type: string
          format: uuid
          examples:
          - 123e4567-e89b-12d3-a456-426614174000
        status:
          description: The current status of the batch operation
          type: string
          enum:
          - in-progress
          - success
          - failed
          examples:
          - in-progress
        resultsSummary:
          description: Summary of merges in this batch task
          type: object
          properties:
            total:
              description: Total number of merges in the batch
              type: integer
              format: int32
              minimum: 0
              maximum: 2147483647
              examples:
              - 5
            inProgress:
              description: Number of merges currently in progress
              type: integer
              format: int32
              minimum: 0
              maximum: 2147483647
              examples:
              - 2
            success:
              description: Number of successfully completed merges
              type: integer
              format: int32
              minimum: 0
              maximum: 2147483647
              examples:
              - 2
            failed:
              description: Number of failed merges
              type: integer
              format: int32
              minimum: 0
              maximum: 2147483647
              examples:
              - 1
          required:
          - total
          - inProgress
          - success
          - failed
          additionalProperties: false
      required:
      - id
      - status
      - resultsSummary
      additionalProperties: false
    NotFoundError:
      title: NotFoundError
      type: object
      properties:
        code:
          description: Error code
          type: string
          enum:
          - not-found
        message:
          description: Error message
          type: string
      required:
      - code
      - message
      additionalProperties: false
      examples:
      - code: not-found
        message: 🚨 Error! Sound the alarm! 🚨
    ValidationError:
      title: ValidationError
      type: object
      properties:
        code:
          description: Error code
          type: string
          enum:
          - validation
        message:
          description: Error message
          type: string
        param:
          description: Param the error refers to
          type: string
      required:
      - code
      - message
      - param
      additionalProperties: false
      examples:
      - code: validation
        param: limit
        message: 🚨 Error! Sound the alarm! 🚨
    Error:
      title: Error
      oneOf:
