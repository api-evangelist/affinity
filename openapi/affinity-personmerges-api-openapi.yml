        message: 🚨 Error! Sound the alarm! 🚨
    PersonMergeTaskPaged:
      x-stability-level: beta
      title: PersonMergeTaskPaged
      description: Paginated person merge tasks
      type: object
      properties:
        data:
          description: Array of person merge tasks
          type: array
          maxItems: 100
